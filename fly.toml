# Fly.io. `fly launch --no-deploy` then `fly deploy`.
app = "label-sheet-generator"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  LSG_TRUSTED_PROXY_HOPS = "1"
  LSG_MAX_CONCURRENT_RENDERS = "2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/livez"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
